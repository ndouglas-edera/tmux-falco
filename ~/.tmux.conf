# --- General Settings ---
set -g default-terminal "screen-256color"  # Enable 256 colors
set -s escape-time 0                      # Eliminate command delay
set -g history-limit 50000                 # Increase scrollback buffer
set -g display-time 4000                   # Keep tmux messages displayed longer
set -g status-interval 5                   # Refresh status bar every 5 seconds
set -g focus-events on                     # Pass focus events to terminal applications
setw -g aggressive-resize on              # Useful in multi-monitor setups

# Change Prefix key to Ctrl+a (easier to reach than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                 # Automatically renumber windows when one is closed

# Enable Mouse Support
set -g mouse on

# --- Key Bindings ---
# Easy config reload
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# Split panes using | and - (opens in current directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes using Vim directions
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Shift + Vim directions
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Visual Styling ---
# Status bar design
set -g status-style bg=black,fg=white
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-right "#[fg=cyan]%d %b %Y #[fg=green]| %H:%M "

# Highlighting active window
setw -g window-status-current-style fg=black,bg=green,bold

# Pane border colors
set -g pane-border-style fg=gray
set -g pane-active-border-style fg=green
